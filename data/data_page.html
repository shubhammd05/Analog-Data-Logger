<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Data Logger</title>
    <script src="chart.min.js"></script>
    <style>
        /* --- Base Setup --- */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f3f4f6; color: #1f2937; }
        
        /* Layout Utilities */
        .container { width: 100%; margin: 0 auto; padding: 0 1.5rem; }
        .max-w-5xl { max-width: 64rem; }
        .p-8 { padding: 2rem; }
        .p-6 { padding: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .space-y-8 > * + * { margin-top: 2rem; }
        .hidden { display: none !important; }

        /* Typography */
        .text-4xl { font-size: 2.25rem; font-weight: 800; color: #111827; margin: 0; }
        .text-xl { font-size: 1.25rem; font-weight: 600; color: #374151; }
        .text-gray-500 { color: #6b7280; margin: 0; }
        .font-bold { font-weight: 700; }

        /* --- RESPONSIVE HEADER --- */
        .header-container {
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on small phones */
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        /* On very small screens, center everything */
        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                justify-content: center;
            }
            .text-4xl { font-size: 1.75rem; } /* Slightly smaller text for phones */
        }

        /* Components */
        .bg-white { background-color: white; }
        .rounded-lg { border-radius: 0.5rem; }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Inputs & Buttons (STATIC) */
        button { cursor: pointer; border: none; font-family: inherit; }
        button:disabled { background-color: #9ca3af !important; cursor: not-allowed; }
        select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; background: #fff; font-size: 1rem; }

        .btn-primary {
            background-color: #8b5cf6; color: white;
            padding: 0.75rem 1.5rem; border-radius: 0.5rem;
            font-weight: 600; width: 100%; font-size: 1rem;
        }
        .btn-primary:hover { background-color: #7c3aed; }
        .btn-primary:active { background-color: #6d28d9; }

        .btn-secondary {
            background-color: #e9d5ff; color: #4c1d95;
            padding: 0.5rem 1rem; border-radius: 0.5rem;
            font-weight: 600; text-decoration: none; display: inline-block;
            white-space: nowrap; /* Prevent button text wrapping */
        }
        .btn-secondary:hover { background-color: #ddd6fe; }

        .btn-small {
            background-color: #f3f4f6; color: #374151;
            padding: 0.35rem 0.85rem; border-radius: 0.375rem;
            font-size: 0.875rem; font-weight: 600;
            border: 1px solid #d1d5db;
        }
        .btn-small:hover { background-color: #e5e7eb; color: #111827; border-color: #9ca3af; }

        /* Status & Progress */
        .status-box {
            padding: 1rem; margin-bottom: 1.5rem; border-radius: 0.5rem;
            text-align: center; font-size: 1.125rem; font-weight: 500;
            border: 1px solid transparent;
        }
        .status-info { background-color: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
        .status-error { background-color: #fef2f2; color: #991b1b; border-color: #fecaca; }

        .progress-track { 
            width: 100%; height: 0.75rem; background-color: #e5e7eb; 
            border-radius: 999px; overflow: hidden; display: none; margin-bottom: 1.5rem; 
        }
        .progress-fill { 
            height: 100%; background-color: #8b5cf6; width: 0%; 
            transition: width 0.3s ease-out; 
        }

        /* Chart & Debug */
        .h-96 { height: 24rem; position: relative; }
        .debug-container { margin-top: 3rem; border-top: 1px solid #e5e7eb; padding-top: 2rem; }
        #debug-log {
            background-color: #111827; color: #4ade80;
            padding: 1rem; border-radius: 0.5rem;
            font-family: monospace; font-size: 0.85rem;
            height: 12rem; overflow-y: auto; white-space: pre-wrap;
        }
        
        /* Helper Flex classes for internal content */
        .flex-row-spaced { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto max-w-5xl p-8">
        
        <header class="header-container">
            <div style="text-align: left;">
                <h1 class="text-4xl">ESP32 Data Logger</h1>
                <p class="text-gray-500" style="margin-top: 0.5rem;">Visualize data, calibrated in real-time</p>
            </div>
            <div>
                 <a href="/parameters.html" class="btn-secondary">Parameters</a>
            </div>
        </header>

        <main class="space-y-8">
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl mb-4">Data Management</h2>
                <div class="mb-4">
                    <label for="fileSelector" class="text-gray-500 font-bold block mb-2">Select File:</label>
                    <select id="fileSelector">
                        <option value="">-- Loading files... --</option>
                    </select>
                </div>
                <button id="loadBtn" onclick="loadChart()" class="btn-primary">Load & Visualize</button>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex-row-spaced mb-4">
                    <h2 class="text-xl">Visualization</h2>
                    <span id="configSummary" class="text-gray-500 bg-gray-100 px-2 py-1 rounded-lg hidden" style="font-size: 0.875rem"></span>
                </div>

                <div id="status" class="status-box status-info">Select a file and click Load to begin</div>
                
                <div id="progress" class="progress-track">
                    <div id="progressBar" class="progress-fill"></div>
                </div>

                <div class="h-96">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

            <div id="debug-container" class="bg-white rounded-lg shadow-md p-6 debug-container"> 
                <div class="flex-row-spaced mb-2">
                    <h3 class="text-xl">System Log</h3>
                    <button onclick="document.getElementById('debug-log').textContent=''" class="btn-small">Clear Log</button>
                </div>
                <div id="debug-log">System Initialized.</div>
            </div>

        </main>
    </div>

<script>
    // --- CONFIG ---
    const DEBUG = false; 

    let chart = null;
    const timestamps = [];
    const calibratedValues = [];
    let channelConfig = {};
    let isLoading = false;

    // --- UTILS ---
    function log(msg, isErr = false) {
        if (!DEBUG) return;
        const box = document.getElementById('debug-log');
        const time = new Date().toLocaleTimeString('en-US', {hour12: false});
        const pre = isErr ? '[ERR] ' : '[INF] ';
        box.textContent += `\n[${time}] ${pre}${msg}`;
        box.scrollTop = box.scrollHeight;
        if(isErr) console.error(msg); else console.log(msg);
    }

    function showStatus(msg, type = 'info') {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = `status-box ${type === 'error' ? 'status-error' : 'status-info'}`;
    }

    function updateProgress(pct) {
        document.getElementById('progress').style.display = 'block';
        document.getElementById('progressBar').style.width = pct + '%';
    }

    function hideProgress() {
        document.getElementById('progress').style.display = 'none';
    }

    // --- LOGIC ---
    async function loadConfig() {
        try {
            const res = await fetch('/config.json?t=' + Date.now());
            return res.ok ? (await res.json()).channels || [] : [];
        } catch (e) { return []; }
    }

    window.addEventListener('load', async () => {
        
        if (!DEBUG) {
            document.getElementById('debug-container').style.display = 'none';
        }

        log('Fetching file list...');
        try {
            const res = await fetch('/api/files?t=' + Date.now());
            const data = await res.json();
            const sel = document.getElementById('fileSelector');
            sel.innerHTML = '<option value="">-- Select File --</option>';

            if (data.channels?.length) {
                data.channels.forEach(ch => {
                    const opt = document.createElement('option');
                    opt.value = ch.filename; 
                    opt.textContent = `${ch.name}`;
                    sel.appendChild(opt);
                });
                log(`Loaded ${data.channels.length} files.`);
            } else {
                sel.innerHTML = '<option value="">No Data Files Found</option>';
            }
        } catch (e) {
            log('Error fetching list: ' + e.message, true);
            showStatus('Error connecting to ESP32', 'error');
        }
    });

    async function loadChart() {
        if (isLoading) return;
        const fname = document.getElementById('fileSelector').value;
        if (!fname) return alert('Please select a file first.');

        isLoading = true;
        document.getElementById('loadBtn').disabled = true;
        timestamps.length = 0;
        calibratedValues.length = 0;
        
        updateProgress(0);
        showStatus(`Loading ${fname}...`);
        log(`Download: ${fname}`);

        try {
            const configs = await loadConfig();
            
            // Map file index to config index
            const match = fname.match(/LOG_(\d+)/);
            const fNum = match ? parseInt(match[1]) : 1;
            const cIdx = (fNum - 1) % 4; 
            channelConfig = configs[cIdx] || {};

            const sum = document.getElementById('configSummary');
            sum.textContent = `Active: ${channelConfig.name || 'Unknown'} | Unit: ${channelConfig.unit || 'raw'} | Scale: ${channelConfig.calibration_scale || 1}`;
            sum.classList.remove('hidden');

            const cleanName = fname.startsWith('/') ? fname.substring(1) : fname;
            const res = await fetch(`/api/stream?file=${cleanName}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '';
            let count = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || ''; 

                for (const line of lines) {
                    if (!line.trim() || line.includes('Year,Month')) continue; 
                    const cols = line.split(',');
                    if (cols.length >= 8) {
                        const t = `${cols[1]}/${cols[2]} ${cols[3]}:${cols[4]}:${cols[5]}.${cols[6]}`;
                        const raw = parseFloat(cols[7]); 
                        const scale = channelConfig.calibration_scale || 1.0;
                        const off = channelConfig.calibration_offset || 0.0;
                        
                        timestamps.push(t);
                        calibratedValues.push((raw * scale) + off);
                        count++;

                        if (count % 100 === 0) {
                            updateChart();
                            updateProgress(Math.min(95, count / 20)); 
                        }
                    }
                }
            }
            
            updateProgress(100);
            updateChart();
            log(`Done. ${count} pts.`);
            showStatus(`Loaded ${count} values for ${channelConfig.name}`, 'info');

        } catch (err) {
            log(`Err: ${err.message}`, true);
            showStatus(`Error: ${err.message}`, 'error');
        } finally {
            isLoading = false;
            hideProgress();
            document.getElementById('loadBtn').disabled = false;
        }
    }

    function updateChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        const limit = 1000; 
        const lbls = timestamps.slice(-limit);
        const vals = calibratedValues.slice(-limit);

        if (chart) {
            chart.data.labels = lbls;
            chart.data.datasets[0].data = vals;
            chart.data.datasets[0].label = `${channelConfig.name || 'Data'} (${channelConfig.unit || 'raw'})`;
            chart.update('none'); 
        } else {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: lbls,
                    datasets: [{
                        label: 'Sensor Data',
                        data: vals,
                        borderColor: '#8b5cf6', 
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0, 
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, 
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: true }, tooltip: { enabled: true } },
                    scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: false } }
                }
            });
        }
    }
</script>
</body>
</html>
